# Cargo configuration for whisper.apr
# Optimized for WASM-first development

[build]
# Use mold linker for faster builds on Linux (if available)
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.wasm32-unknown-unknown]
# WASM-specific build settings
rustflags = [
    "-C", "target-feature=+simd128",
    "-C", "opt-level=3",
]

[target.x86_64-unknown-linux-gnu]
# Native Linux build settings
rustflags = [
    "-C", "target-cpu=native",
]

[target.aarch64-apple-darwin]
# Apple Silicon build settings
rustflags = [
    "-C", "target-cpu=native",
]

[alias]
# Useful aliases
wasm = "build --target wasm32-unknown-unknown --release"
t = "test --lib"
tq = "test --lib -- --quiet"
lint = "clippy -- -D warnings"

[env]
# Environment variables for builds
RUST_BACKTRACE = "1"

[profile.dev]
# Faster dev builds
opt-level = 0
debug = true

[profile.release]
# Optimized release builds
opt-level = 3
lto = "thin"
codegen-units = 1
