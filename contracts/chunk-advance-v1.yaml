metadata:
  version: "2.1.0"
  author: "Sovereign AI Stack"
  description: "Long-audio window seek contract: each 30s window starts exactly where the previous decode's kept segments end (no fixed overlap, nothing decoded twice, nothing skipped); an unfinished final segment of a non-last window (unclosed, or ending within EDGE_SECS = 1.0s of the window edge) is dropped and re-decoded from its start; segments are stitched without concatenating text, and punctuation-only segments are not emitted"
  crate: "whisper-apr"
  references:
    - "whisper.apr issue #105 (7-15 repeated 5-grams per 76-117s lesson against 0 for whisper.cpp, and 39s merged cues missing a clause, large-v3-turbo on a GX10)"
    - "whisper.apr issue #105 follow-up (ff288fb on a GX10: a closed final segment clamped to the window edge, 26.20->30.000 and 52.0->60.000, advanced the full window and lost 19-20 words per lesson; stray \".\" cues at 30.000->30.087)"
    - "whisper.apr issue #84 (multi-second spans of speech silently dropped: 17.00->25.00 on a 52.58s recording, 36.00->50.00 plus a 4.96s tail on a 193.40s recording)"
    - "whisper.apr issue #82/#83 (window WIDTH; this contract is about window ADVANCE and is a different failure)"
    - "src/core_generated.rs WhisperApr::window_advance, seek_segments, stitch_segments — single source of truth for the seek"
    - "OpenAI whisper transcribe(): seek advances to the last closed timestamp; an unfinished final segment is re-decoded by the next window"

equations:
  window_advance:
    formula: "advance(w, c) = if c = 0 then w else min(max(c, min(floor, w)), w)"
    domain: "w = window samples > 0, c = covered samples >= 0, floor = MIN_ADVANCE_SAMPLES"
    codomain: "samples in [1, w]"
    invariants:
      - "c >= min(floor, w) and c <= w implies advance(w, c) = c — the next window starts exactly where the decode stopped: never past it (#84), never before it (#105)"
      - "1 <= advance(w, c) <= w — the loop always makes progress and terminates"
      - "c = 0 implies advance(w, c) = w — a window the decode examined and rejected is strided past, not re-examined forever"
  covered_samples:
    formula: "covered(S, w) = min(w, floor(max{ seg.end : seg in S } * SAMPLE_RATE))"
    domain: "S = the segments a window keeps, in window-local seconds"
    codomain: "samples in [0, w]"
    invariants:
      - "covered(empty, w) = 0"
      - "covered(S, w) <= w — a hallucinated over-long segment cannot inflate the advance past its own window"
  seek_point:
    formula: "seek(S, closed, last, w) = (S minus final(S), floor(start(final(S)) * SAMPLE_RATE)) iff unfinished and not last and |S| >= 2 and start(final(S)) * SAMPLE_RATE >= min(floor, w), else (S, covered(S, w)); unfinished = not closed or end(final(S)) >= w / SAMPLE_RATE - EDGE_SECS, EDGE_SECS = 1.0"
    domain: "S = one window's segments, closed = the decode's last non-control token is a timestamp (or it has no timestamps), last = the window reaches the end of the audio"
    codomain: "kept segments and the covered samples that drive window_advance"
    invariants:
      - "a dropped segment's start is where the next window begins, so its words are decoded whole by that window"
      - "the last window never drops a segment; a closed decode drops its final segment only when that segment ends within EDGE_SECS of the window edge"
      - "a final segment ending at the window edge never drives a full-window advance, so speech cut by the edge is decoded by the next window"
  segment_placement:
    formula: "place(S, w_secs, t0) = { (max(s.start,0)+t0, min(s.end,w_secs)+t0) : s in S, s.start < w_secs }"
    domain: "S = one window's segments in window-local seconds, w_secs = window duration, t0 = window offset"
    invariants:
      - "no emitted cue ends after the end of the window it was decoded from"
  stitch:
    formula: "stitch(S) folds S left to right: drop s when s.text has no alphanumeric character; drop s when trim(s.text) = trim(prev.text) and s overlaps or touches prev within 0.1s; else emit s with start' = max(s.start, prev.end), end' = max(s.end, start')"
    domain: "S = all windows' placed segments in timeline order"
    invariants:
      - "every emitted text is exactly one input segment's text — text is never concatenated"
      - "emitted starts are non-decreasing and each start >= the previous emitted end"
      - "no two adjacent emitted segments carry the same trimmed text while touching"
      - "every emitted text contains at least one alphanumeric character"
  timeline_coverage:
    formula: "offset_{i+1} = offset_i + advance(w_i, covered_i)"
    domain: "the window loop of transcribe_chunked over any audio longer than CHUNK_SAMPLES"
    invariants:
      - "offset_{i+1} <= offset_i + covered_i when covered_i >= floor — the emitted timeline has no hole"
      - "offset_{i+1} >= offset_i + covered_i — no decoded span is decoded again"
      - "the last window's decoded span reaches audio_len (up to the 0.5s tail guard)"

proof_obligations:
  - type: invariant
    property: "Advance never outruns the decode"
    formal: "forall w, c: MIN_ADVANCE_SAMPLES <= c <= w implies window_advance(w, c) <= c"
    applies_to: all
  - type: invariant
    property: "Loop progress and termination"
    formal: "forall w > 0, c: 1 <= window_advance(w, c) <= w"
    applies_to: all
  - type: invariant
    property: "No re-decode"
    formal: "forall w, c > 0: window_advance(w, c) >= min(c, w)"
    applies_to: all
  - type: invariant
    property: "No hole in the emitted timeline"
    formal: "forall i: offset_{i+1} <= offset_i + covered_i"
    applies_to: all
  - type: invariant
    property: "Unclosed final segment is re-decoded"
    formal: "not closed and not last and |S| >= 2 and start(final(S)) >= floor implies covered(seek(S)) = start(final(S))"
    applies_to: all
  - type: invariant
    property: "Cues stay inside the window they came from"
    formal: "forall s in place(S, w_secs, t0): s.end <= t0 + w_secs"
    applies_to: all
  - type: invariant
    property: "Stitch never concatenates and keeps starts monotonic"
    formal: "forall s in stitch(S): s.text in texts(S) and forall i: start_{i+1} >= end_i"
    applies_to: all
  - type: invariant
    property: "Duplicated adjacent segment is emitted once"
    formal: "trim(a.text) = trim(b.text) and b.start <= a.end + 0.1 implies |stitch([a, b])| = 1"
    applies_to: all
  - type: invariant
    property: "Final segment at the window edge is re-decoded"
    formal: "end(final(S)) >= w_secs - EDGE_SECS and not last and |S| >= 2 and start(final(S)) >= floor implies covered(seek(S)) = start(final(S)) < w"
    applies_to: all
  - type: invariant
    property: "Punctuation-only segments are not emitted"
    formal: "forall s in stitch(S): exists c in s.text: alphanumeric(c)"
    applies_to: all

falsification_tests:
  - id: FALSIFY-CHUNKGAP-001
    rule: "Advance never outruns the decode"
    test: "window_advance_never_outruns_the_decode"
    prediction: "verified"
    if_fails: "A window that decoded 17s of its 30s advances further, so speech is never handed to the model again (issue #84 regression)"
  - id: FALSIFY-CHUNKGAP-002
    rule: "Loop progress and termination"
    test: "window_advance_always_progresses_and_terminates"
    prediction: "verified"
    if_fails: "An advance of 0 or past the window, or a degenerate decode that makes the loop crawl one sample at a time"
  - id: FALSIFY-CHUNKGAP-003
    rule: "No hole in the emitted timeline"
    test: "decoded_spans_leave_no_hole_in_the_audio"
    prediction: "verified"
    if_fails: "Replaying the measured coverage of the #84 recordings leaves 17.00-25.00, 36.00-50.00, or a 4.96s tail absent from the timeline"
  - id: FALSIFY-CHUNKGAP-005
    rule: "Cues stay inside the window they came from"
    test: "segments_never_escape_their_window"
    prediction: "verified"
    if_fails: "A 1.38s tail window emits cues past the end of the recording (54.2s on a 52.58s file)"
  - id: FALSIFY-CHUNKGAP-006
    rule: "Coverage is measured, and bounded by the window"
    test: "coverage_is_measured_from_the_segments"
    prediction: "verified"
    if_fails: "Coverage is assumed rather than measured, or a hallucinated over-long segment inflates the advance past its window"
  - id: FALSIFY-CHUNKGAP-007
    rule: "No re-decode"
    test: "a_full_coverage_loop_never_redecodes_audio"
    prediction: "verified"
    if_fails: "A full-coverage loop over 120s re-decodes the tail of each window (the 25s cap), so whole phrases are emitted twice (issue #105)"
  - id: FALSIFY-CHUNKGAP-008
    rule: "Unclosed final segment is re-decoded"
    test: "an_unclosed_final_segment_is_redecoded_by_the_next_window"
    prediction: "verified"
    if_fails: "A final segment with a guessed 60ms/token end, cut at the 30s edge, is kept and drives the advance, so its missing words are never decoded"
  - id: FALSIFY-CHUNKGAP-009
    rule: "Stitch never concatenates and keeps starts monotonic"
    test: "stitching_never_concatenates_and_keeps_starts_monotonic"
    prediction: "verified"
    if_fails: "Touching segments pile up into one 39s blob that split_long_segments re-times by character count, losing a clause"
  - id: FALSIFY-CHUNKGAP-010
    rule: "Duplicated adjacent segment is emitted once"
    test: "a_duplicated_adjacent_segment_is_emitted_once"
    prediction: "verified"
    if_fails: "The same words decoded at the end of one window and the start of the next appear twice in the transcript"
  - id: FALSIFY-CHUNKGAP-011
    rule: "Final segment at the window edge is re-decoded"
    test: "a_final_segment_at_the_window_edge_is_redecoded"
    prediction: "verified"
    if_fails: "A closed final segment clamped to the window edge (26.20->30.000) advances the full window, so the speech after its text is never decoded (19-20 words lost per lesson on ff288fb)"
  - id: FALSIFY-CHUNKGAP-012
    rule: "Punctuation-only segments are not emitted"
    test: "punctuation_only_segments_are_not_emitted"
    prediction: "verified"
    if_fails: "A stray \".\" cue (30.000->30.087) is emitted as a subtitle with no words"

qa_gate:
  id: QA-CHUNK-ADVANCE
  name: "long-audio window seek contract"
  min_coverage: 0.90
  max_complexity: 10
  required_tests:
    - window_advance_never_outruns_the_decode
    - window_advance_always_progresses_and_terminates
    - decoded_spans_leave_no_hole_in_the_audio
    - segments_never_escape_their_window
    - coverage_is_measured_from_the_segments
    - a_full_coverage_loop_never_redecodes_audio
    - an_unclosed_final_segment_is_redecoded_by_the_next_window
    - stitching_never_concatenates_and_keeps_starts_monotonic
    - a_duplicated_adjacent_segment_is_emitted_once
    - a_final_segment_at_the_window_edge_is_redecoded
    - punctuation_only_segments_are_not_emitted

kani_harnesses:
  - id: chunk-advance-kani-001
    obligation: "Advance never outruns the decode"
    bound: 8
    strategy: exhaustive
  - id: chunk-advance-kani-002
    obligation: "Loop progress and termination"
    bound: 8
    strategy: exhaustive
