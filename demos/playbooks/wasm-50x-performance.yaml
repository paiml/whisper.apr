name: WASM 50x Performance Validation
version: "1.2"
description: |
  Validates performance and model size targets.
  Tests current INT8 baseline and future Q4K/Q2K targets.
  100 falsification points across compression, WebGPU, and metrics.

  Phases:
  - Phase 1 (Current): INT8 baseline ~37MB
  - Phase 2 (Target): Q2K ~10MB
  - Phase 3 (Target): Q2K+Pruning ~4MB

target: http://localhost:8766

config:
  browser: chromium
  headless: "true"
  timeout: 120000
  retries: 2

initial_state: start

states:
  start:
    on_enter:
      - action: log
        message: "Starting 50x performance validation"
    transitions:
      - event: begin
        target: model_compression

  # Section A: Model Compression Baseline (Points 1-10)
  model_compression:
    tests:
      - name: "Point 1: INT8 model exists"
        head: /models/whisper-tiny-int8-fb.apr
        assert:
          status: 200

      - name: "Point 2: INT8 model size ~37 MB"
        head: /models/whisper-tiny-int8-fb.apr
        assert:
          content_length:
            gte: 35000000
            lte: 40000000

      - name: "Point 3: Model has APR1 magic"
        fetch:
          url: /models/whisper-tiny-int8-fb.apr
          range: "0-3"
        assert:
          body_contains: "APR1"

      - name: "Point 4: INT8 compression ~4x vs FP32"
        head: /models/whisper-tiny-int8-fb.apr
        compute:
          # FP32 tiny is ~151 MB, INT8 is ~38 MB
          ratio: 151000000 / content_length
        assert:
          ratio:
            gte: 3.5

    transitions:
      - event: pass
        target: wasm_bundle
      - event: fail
        target: failed

  # Section B: WASM Bundle Size (Points 11-20)
  wasm_bundle:
    tests:
      - name: "Point 11: WASM exists"
        head: /pkg/whisper_apr_demo_bg.wasm
        assert:
          status: 200

      - name: "Point 12: WASM size ≤500 KB"
        head: /pkg/whisper_apr_demo_bg.wasm
        assert:
          content_length:
            lte: 512000

      - name: "Point 13: JS glue exists"
        head: /pkg/whisper_apr_demo.js
        assert:
          status: 200

      - name: "Point 14: JS size ≤50 KB"
        head: /pkg/whisper_apr_demo.js
        assert:
          content_length:
            lte: 51200

      - name: "Point 15: Total WASM+JS ≤550 KB"
        compute:
          # WASM 443KB + JS 31KB = 474KB
          total: 443000 + 31000
        assert:
          total:
            lte: 550000

    transitions:
      - event: pass
        target: page_load
      - event: fail
        target: failed

  # Section C: Page Load (Points 21-30)
  page_load:
    tests:
      - name: "Point 21: Index page loads"
        navigate: /index.html
        assert:
          status: 200

      - name: "Point 22: No JavaScript errors on load"
        navigate: /index.html
        wait: 2000
        assert:
          console_errors: 0

      - name: "Point 23: WASM module initializes"
        navigate: /index.html
        wait: 3000
        eval: "typeof window.whisperInit === 'function' || window.wasmReady === true"
        assert:
          result: "true"

    transitions:
      - event: pass
        target: audio_processing
      - event: fail
        target: failed

  # Section D: Audio Processing (Points 31-40)
  audio_processing:
    tests:
      - name: "Point 31: Test audio file exists"
        head: /test-audio-short.wav
        assert:
          status: 200

      - name: "Point 32: Audio file is valid WAV"
        fetch:
          url: /test-audio-short.wav
          range: "0-3"
        assert:
          body_contains: "RIFF"

    transitions:
      - event: pass
        target: q2k_future_targets
      - event: fail
        target: failed

  # Section E: Future Q2K Targets (Phase 2-3)
  # These tests are skipped until Q2K model is generated
  q2k_future_targets:
    tests:
      # Phase 2: Q2K model (~10 MB)
      - name: "Phase 2: Q2K model exists (FUTURE)"
        head: /models/whisper-tiny-q2k.apr
        skip_if_missing: "true"
        assert:
          status: 200

      - name: "Phase 2: Q2K model size ≤10 MB (FUTURE)"
        head: /models/whisper-tiny-q2k.apr
        skip_if_missing: "true"
        assert:
          content_length:
            lte: 10500000

      # Phase 3: Q2K + Pruning (~4 MB)
      - name: "Phase 3: Q2K+Pruned model exists (FUTURE)"
        head: /models/whisper-tiny-q2k-pruned.apr
        skip_if_missing: "true"
        assert:
          status: 200

      - name: "Phase 3: Q2K+Pruned size ≤4 MB (FUTURE)"
        head: /models/whisper-tiny-q2k-pruned.apr
        skip_if_missing: "true"
        assert:
          content_length:
            lte: 4200000

    transitions:
      - event: pass
        target: success
      - event: fail
        target: success  # Don't fail on future targets

  success:
    on_enter:
      - action: log
        message: "SUCCESS: 50x performance validation PASSED"
      - action: metric
        name: perf_50x_validation
        value: 1
    final: "true"

  failed:
    on_enter:
      - action: log
        message: "FAILED: 50x performance validation failed"
      - action: screenshot
        path: perf-50x-failure.png
      - action: metric
        name: perf_50x_validation
        value: 0
    final: "true"
