# SIMD Validation Playbook
# WAPR-PERF-002: Validates SIMD acceleration via trueno
#
# Run: probador playbook demos/playbooks/simd-validation.yaml
#
# This playbook validates SIMD capabilities, performance, and correctness.

version: "1.0"
name: "SIMD Acceleration Validation"
description: "WAPR-PERF-002: SIMD capability detection and performance validation"

machine:
  id: "simd_validation"
  initial: "idle"

  states:
    idle:
      id: "idle"
      invariants:
        - description: "System ready for SIMD detection"
          condition: "system_initialized()"

    detecting:
      id: "detecting"
      invariants:
        - description: "Detecting SIMD capabilities"
          condition: "detection_in_progress()"

    simd_detected:
      id: "simd_detected"
      invariants:
        - description: "SIMD capability determined"
          condition: "simd_capability_known()"
        - description: "At least WASM SIMD 128 available"
          condition: "has_wasm_simd128() || has_native_simd()"

    benchmarking:
      id: "benchmarking"
      invariants:
        - description: "Running SIMD benchmarks"
          condition: "benchmark_running()"
        - description: "SIMD path enabled"
          condition: "simd_enabled()"

    validating:
      id: "validating"
      invariants:
        - description: "Validating numerical correctness"
          condition: "validation_running()"

    complete:
      id: "complete"
      invariants:
        - description: "SIMD validation passed"
          condition: "validation_passed()"
        - description: "Speedup meets target"
          condition: "speedup() >= 1.5"

  transitions:
    - id: "start_detection"
      from: "idle"
      to: "detecting"
      event: "detect_simd"

    - id: "detection_complete"
      from: "detecting"
      to: "simd_detected"
      event: "simd_detected"

    - id: "start_benchmarks"
      from: "simd_detected"
      to: "benchmarking"
      event: "run_benchmarks"

    - id: "start_validation"
      from: "benchmarking"
      to: "validating"
      event: "benchmarks_complete"

    - id: "finish"
      from: "validating"
      to: "complete"
      event: "validation_passed"

    - id: "reset"
      from: "complete"
      to: "idle"
      event: "reset_validation"

performance:
  max_duration_ms: 30000
  min_speedup: 1.5
  tolerance: 1e-6

# Test specifications (for reference in test implementation)
specifications:
  benchmarks:
    - operation: dot_product
      sizes: [256, 1024, 4096, 16384]
      min_speedup: 1.5

    - operation: matvec
      sizes: [[384, 384], [512, 512]]
      min_speedup: 2.0

    - operation: softmax
      sizes: [51865]
      min_speedup: 1.5

    - operation: layer_norm
      sizes: [384, 512, 768]
      min_speedup: 1.2

    - operation: gelu
      sizes: [384, 1536, 3072]
      min_speedup: 1.3

  correctness:
    - operation: dot_product
      tolerance: 1e-6

    - operation: softmax
      stability_check: "true"
      extreme_values: [1000.0, -1000.0]

    - operation: layer_norm
      zero_variance_safe: "true"
