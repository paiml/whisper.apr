# Quantization QA Playbook
# WAPR-PERF-002: Q4K/Q5K/Q6K Validation
#
# Run: probador playbook demos/playbooks/quantization-qa.yaml
#
# This playbook validates quantized model correctness and performance.

version: "1.0"
name: "Quantization Quality Assurance"
description: "WAPR-PERF-002: Q4K/Q5K/Q6K quantization validation"

machine:
  id: "quantization_qa"
  initial: "idle"

  states:
    idle:
      id: "idle"
      invariants:
        - description: "System ready for quantization tests"
          condition: "system_initialized()"

    loading:
      id: "loading"
      invariants:
        - description: "Loading quantized model"
          condition: "model_loading()"

    loaded:
      id: "loaded"
      invariants:
        - description: "Quantized model loaded"
          condition: "model_ready()"
        - description: "No loading errors"
          condition: "no_load_errors()"

    validating_numerical:
      id: "validating_numerical"
      invariants:
        - description: "Checking numerical stability"
          condition: "validation_running()"
        - description: "No NaN values detected"
          condition: "no_nan_values()"
        - description: "No Inf values detected"
          condition: "no_inf_values()"

    validating_accuracy:
      id: "validating_accuracy"
      invariants:
        - description: "Comparing to FP32 baseline"
          condition: "accuracy_test_running()"

    transcribing:
      id: "transcribing"
      invariants:
        - description: "Running inference"
          condition: "inference_running()"
        - description: "Under max tokens"
          condition: "token_count() < 448"

    complete:
      id: "complete"
      invariants:
        - description: "Quantization tests passed"
          condition: "all_tests_passed()"
        - description: "WER within tolerance"
          condition: "wer_increase() < 2.0"
        - description: "Compression ratio acceptable"
          condition: "compression_ratio() >= 4.5"

  transitions:
    - id: "start_loading"
      from: "idle"
      to: "loading"
      event: "load_model"

    - id: "model_ready"
      from: "loading"
      to: "loaded"
      event: "loading_complete"

    - id: "start_numerical"
      from: "loaded"
      to: "validating_numerical"
      event: "validate_numerical"

    - id: "start_accuracy"
      from: "validating_numerical"
      to: "validating_accuracy"
      event: "numerical_valid"

    - id: "start_transcription"
      from: "validating_accuracy"
      to: "transcribing"
      event: "accuracy_valid"

    - id: "finish"
      from: "transcribing"
      to: "complete"
      event: "transcription_complete"

    - id: "reset"
      from: "complete"
      to: "idle"
      event: "reset_qa"

performance:
  max_duration_ms: 60000
  max_wer_increase: 2.0
  min_compression_ratio: 4.5

# Quantization format specifications
specifications:
  formats:
    Q4K:
      bits: 4
      block_size: 256
      compression_range: [6.5, 7.5]
      max_wer_increase: 2.0

    Q5K:
      bits: 5
      block_size: 256
      compression_range: [5.5, 6.0]
      max_wer_increase: 1.0

    Q6K:
      bits: 6
      block_size: 256
      compression_range: [4.5, 5.0]
      max_wer_increase: 0.5

  numerical_tests:
    - no_nan_after_dequant: true
    - no_inf_after_dequant: true
    - l2_error_max: 0.01
    - cosine_similarity_min: 0.99
    - scale_range: [-65504.0, 65504.0]

  accuracy_tests:
    reference_audio: "demos/test-audio/test-speech-1.5s.wav"
    expected_output: "The birds can use"
    max_edit_distance: 3

  hallucination_checks:
    - no_repetition_pattern: "(.{5,})\\1{3,}"
    - max_tokens: 448
    - eot_detected: true
