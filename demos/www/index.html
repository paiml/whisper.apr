<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper.apr Demo - Real-time Speech Recognition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #4dc3ff;
        }
        .status-bar {
            background: #16213e;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        #status {
            flex: 1;
            font-weight: 500;
        }
        .vu-container {
            width: 150px;
            height: 20px;
            background: #0f3460;
            border-radius: 4px;
            overflow: hidden;
        }
        #vu_meter {
            height: 100%;
            background: linear-gradient(90deg, #4dc3ff, #50fa7b);
            width: 0%;
            transition: width 50ms;
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #record {
            background: #e94560;
            color: white;
            flex: 1;
        }
        #record:hover:not(:disabled) {
            background: #ff6b6b;
        }
        #record:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #record.recording {
            background: #50fa7b;
            animation: pulse 1s infinite;
        }
        #clear {
            background: #4dc3ff;
            color: #1a1a2e;
        }
        #clear:hover {
            background: #7dd5ff;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .output {
            background: #16213e;
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 200px;
        }
        #partial {
            color: #888;
            font-style: italic;
            margin-bottom: 1rem;
            min-height: 1.5em;
        }
        #transcript {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .recording #record::before {
            content: "Stop ";
        }
        body.recording {
            --accent: #50fa7b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Whisper.apr Demo</h1>

        <div class="status-bar">
            <span id="status" aria-live="polite">Loading model...</span>
            <div class="vu-container">
                <div id="vu_meter" role="meter" aria-label="Audio level"></div>
            </div>
        </div>

        <div class="controls">
            <button id="record" disabled aria-label="Start/Stop Recording">Record</button>
            <button id="clear" aria-label="Clear transcript">Clear</button>
        </div>

        <div class="output">
            <div id="partial" aria-live="polite"></div>
            <div id="transcript" role="log" aria-live="polite" aria-label="Transcription output"></div>
        </div>
    </div>

    <script type="module">
        import init, { WorkerManager } from './pkg/whisper_apr_demo.js';

        let manager = null;
        let isRecording = false;
        let audioContext = null;
        let mediaStream = null;
        let audioWorkletNode = null;

        const status = document.getElementById('status');
        const recordBtn = document.getElementById('record');
        const clearBtn = document.getElementById('clear');
        const transcript = document.getElementById('transcript');
        const partial = document.getElementById('partial');
        const vuMeter = document.getElementById('vu_meter');

        async function initDemo() {
            try {
                console.log('[Demo] Starting initialization...');
                status.textContent = 'Loading WASM...';
                await init();
                console.log('[Demo] WASM initialized');

                status.textContent = 'Spawning worker...';
                console.log('[Demo] Creating WorkerManager...');
                manager = new WorkerManager();
                
                console.log('[Demo] Spawning worker with model: /models/whisper-tiny.apr');
                await manager.spawn('/models/whisper-tiny.apr');
                console.log('[Demo] Worker spawned successfully');

                // Listen for model loaded event
                window.addEventListener('whisper-model-loaded', (e) => {
                    const { sizeMb, loadTimeMs } = e.detail;
                    status.textContent = `Ready (${sizeMb.toFixed(1)}MB in ${(loadTimeMs/1000).toFixed(1)}s)`;
                    recordBtn.disabled = false;
                });

                // Listen for transcription events
                window.addEventListener('whisper-transcription', (e) => {
                    const { text, isFinal } = e.detail;
                    if (isFinal) {
                        transcript.textContent += text + ' ';
                        partial.textContent = '';
                    } else {
                        partial.textContent = text;
                    }
                });

                // Wait for worker ready before sending init
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Worker ready timeout')), 30000);

                    window.addEventListener('whisper-worker-ready', () => {
                        clearTimeout(timeout);
                        resolve();
                    }, { once: true });

                    // Spawn worker (will emit whisper-worker-ready when WASM loads)
                    manager.spawn('/models/whisper-tiny.apr');
                });

                // Now worker is ready, send init to load model
                status.textContent = 'Loading model...';
                manager.send_init();

            } catch (err) {
                console.error('Init failed:', err);
                status.textContent = 'Error: ' + err.message;
            }
        }

        async function startRecording() {
            try {
                // Get microphone
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext();

                // Create audio source
                const source = audioContext.createMediaStreamSource(mediaStream);

                // Use ScriptProcessor for audio capture (AudioWorklet requires module loading)
                const processor = audioContext.createScriptProcessor(4096, 1, 1);
                const ringBuffer = manager.getRingBuffer();

                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    const samples = e.inputBuffer.getChannelData(0);

                    // Write to ring buffer
                    if (ringBuffer) {
                        ringBuffer.write(samples);
                    }

                    // Update VU meter
                    let sum = 0;
                    for (let i = 0; i < samples.length; i++) {
                        sum += samples[i] * samples[i];
                    }
                    const rms = Math.sqrt(sum / samples.length);
                    vuMeter.style.width = Math.min(100, rms * 500) + '%';
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                // Start processing
                manager.startRecording(audioContext.sampleRate);
                isRecording = true;

                status.textContent = 'Recording...';
                recordBtn.textContent = 'Stop';
                recordBtn.classList.add('recording');
                document.body.classList.add('recording');

            } catch (err) {
                console.error('Start recording failed:', err);
                status.textContent = 'Error: ' + err.message;
            }
        }

        function stopRecording() {
            isRecording = false;

            // Stop the worker
            manager.stopRecording();

            // Clean up audio
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            status.textContent = 'Ready';
            recordBtn.textContent = 'Record';
            recordBtn.classList.remove('recording');
            document.body.classList.remove('recording');
            vuMeter.style.width = '0%';
        }

        // Event listeners
        recordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        clearBtn.addEventListener('click', () => {
            transcript.textContent = '';
            partial.textContent = '';
        });

        // Initialize
        initDemo();
    </script>
</body>
</html>
