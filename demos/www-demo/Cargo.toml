[package]
name = "whisper-apr-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-JS Whisper.apr Demo - All Logic in Rust"

# cdylib for WASM, rlib for linking
# Note: Unit tests for this crate are in whisper-apr-demo-tests to avoid
# wasm-bindgen linker conflicts on native targets.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Disable default features to avoid parallel (needs atomics), enable wasm + simd only
whisper-apr = { workspace = true, features = ["wasm", "simd"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
tracing.workspace = true
tracing-wasm.workspace = true
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
# Use crates.io versions for compatibility with presentar-core
probar-js-gen = "1.0"
# Brick Architecture for test-driven UI (PROBAR-SPEC-009)
jugar-probar = { version = "1.0", default-features = false }
# Presentar: Brick-based rendering engine (tests define interface)
presentar-core = { version = "0.2", features = ["brick"] }

[dependencies.web-sys]
workspace = true
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlDivElement",
    "Node",
    "Text",
    "Event",
    "MouseEvent",
    "CssStyleDeclaration",
    "DomTokenList",
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "BaseAudioContext",
    "MediaStreamAudioSourceNode",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "Response",
    "console",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Worker",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "ErrorEvent",
    "CustomEvent",
    "CustomEventInit",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "MessagePort",
    "Location",
    "WorkerOptions",
    "WorkerType",
    "Performance",
]

[features]
default = []
# Enable mock window detection for unit testing
test-mocks = []

[dev-dependencies]
wasm-bindgen-test = "0.3"
proptest = "1.5"

# Binary to generate index.html from Brick definitions (Zero hand-written HTML)
[[bin]]
name = "gen-index"
path = "src/bin/gen_index.rs"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
