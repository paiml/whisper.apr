<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper.apr Demo - Real-time Speech Recognition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #4dc3ff;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #record {
            background: #e94560;
            color: white;
            flex: 1;
        }
        #record:hover:not(:disabled) {
            background: #ff6b6b;
        }
        #record:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #record.recording {
            background: #50fa7b;
            animation: pulse 1s infinite;
        }
        #clear {
            background: #4dc3ff;
            color: #1a1a2e;
        }
        #clear:hover {
            background: #7dd5ff;
        }
        .output {
            background: #16213e;
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 200px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
.status-brick {
    background: #16213e;
    padding: 1rem;
    border-radius: 8px;
    font-weight: 500;
}

.status-loading {
    color: #4dc3ff;
}

.status-ready {
    color: #50fa7b;
}

.status-recording {
    color: #50fa7b;
    animation: pulse 1s infinite;
}

.status-error {
    color: #e94560;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.vu-meter-brick {
    display: flex;
    align-items: center;
}

.vu-container {
    width: 150px;
    height: 20px;
    background: #0f3460;
    border-radius: 4px;
    overflow: hidden;
}

.vu-bar {
    height: 100%;
    background: linear-gradient(90deg, #4dc3ff, #50fa7b);
    transition: width 50ms;
}

.transcription-brick {
    background: #16213e;
    border-radius: 8px;
    padding: 1.5rem;
    min-height: 200px;
}

.transcription-partial {
    color: #888;
    font-style: italic;
    margin-bottom: 1rem;
    min-height: 1.5em;
}

.transcription-final {
    color: #eee;
    font-size: 1.2rem;
    line-height: 1.6;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Whisper.apr Demo</h1>

        <div class="status-bar">
            <div class="status-brick status-loading" data-testid="status" aria-live="polite">
    <span id="status">Loading...</span>
</div>
            <div class="vu-meter-brick" data-testid="vu-meter">
    <div class="vu-container">
        <div id="vu_meter" class="vu-bar" style="width: 0%"
             role="meter" aria-label="Audio level" aria-valuenow="0"
             aria-valuemin="0" aria-valuemax="100"></div>
    </div>
</div>
        </div>

        <div class="controls">
            <button id="record" disabled aria-label="Start/Stop Recording">Record</button>
            <button id="clear" aria-label="Clear transcript">Clear</button>
        </div>

        <div class="output">
            <div class="transcription-brick" data-testid="transcription">
    
    
</div>
        </div>
    </div>

    <script type="module">
        // Minimal JS glue - all logic in WASM (PROBAR-SPEC-009)
        import init, { WorkerManager } from './pkg/whisper_apr_demo.js';

        let manager = null;
        let isRecording = false;
        let audioContext = null;
        let mediaStream = null;

        const status = document.getElementById('status');
        const recordBtn = document.getElementById('record');
        const clearBtn = document.getElementById('clear');
        const vuMeter = document.getElementById('vu_meter');

        async function initDemo() {
            try {
                status.textContent = 'Loading WASM...';
                await init();
                status.textContent = 'Spawning worker...';
                manager = new WorkerManager();
                await manager.spawn('/models/whisper-tiny.apr');

                window.addEventListener('whisper-worker-ready', () => {
                    status.textContent = 'Loading model...';
                    manager.send_init();
                }, { once: true });

                window.addEventListener('whisper-model-loaded', (e) => {
                    const { sizeMb, loadTimeMs } = e.detail;
                    status.textContent = `Ready (${sizeMb.toFixed(1)}MB in ${(loadTimeMs/1000).toFixed(1)}s)`;
                    recordBtn.disabled = false;
                });

                window.addEventListener('whisper-transcription', (e) => {
                    const { text, isFinal } = e.detail;
                    const target = isFinal ? document.querySelector('.transcription-final') : document.querySelector('.transcription-partial');
                    if (target) {
                        if (isFinal) {
                            target.textContent += text + ' ';
                            const partial = document.querySelector('.transcription-partial');
                            if (partial) partial.textContent = '';
                        } else {
                            target.textContent = text;
                        }
                    }
                });
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
            }
        }

        recordBtn.addEventListener('click', async () => {
            if (isRecording) {
                manager.stopRecording();
                if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                if (audioContext) audioContext.close();
                isRecording = false;
                recordBtn.textContent = 'Record';
                recordBtn.classList.remove('recording');
                status.textContent = 'Ready';
                vuMeter.style.width = '0%';
            } else {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(mediaStream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);
                const ringBuffer = manager.getRingBuffer();

                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    const samples = e.inputBuffer.getChannelData(0);
                    if (ringBuffer) ringBuffer.write(samples);
                    let sum = 0;
                    for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
                    vuMeter.style.width = Math.min(100, Math.sqrt(sum / samples.length) * 500) + '%';
                };

                source.connect(processor);
                processor.connect(audioContext.destination);
                manager.startRecording(audioContext.sampleRate);
                isRecording = true;
                recordBtn.textContent = 'Stop';
                recordBtn.classList.add('recording');
                status.textContent = 'Recording...';
            }
        });

        clearBtn.addEventListener('click', () => {
            document.querySelector('.transcription-final').textContent = '';
            document.querySelector('.transcription-partial').textContent = '';
        });

        initDemo();
    </script>
</body>
</html>
