# cargo-deny configuration (0.18.x)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Transitive unmaintained crates from wgpu — no action possible
ignore = [
    "RUSTSEC-2025-0141",  # bincode unmaintained (transitive via wgpu)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (transitive via wgpu)
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive via wgpu)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

deny = [
    { name = "cargo-tarpaulin", reason = "Use cargo-llvm-cov for coverage" },
    { name = "tarpaulin", reason = "Use cargo-llvm-cov for coverage" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
