[package]
name = "whisper-apr"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
# PMAT-158 / issue #54: disable auto-discovery of the 104 ad-hoc debug examples
# and the 6 benches. They each re-link the lib (~+41s wall) and several benches
# are broken against the current aprender API, which makes `cargo build
# --all-targets` fail. Only the targets explicitly re-declared below are built;
# the retired sources stay on disk (un-built) for manual `cargo run --example`.
autoexamples = false
autobenches = false
description = "WASM-first automatic speech recognition engine implementing OpenAI Whisper"
license = "MIT"
repository = "https://github.com/paiml/whisper.apr"
documentation = "https://docs.rs/whisper-apr"
readme = "README.md"
keywords = ["whisper", "speech-recognition", "asr", "wasm", "audio"]
categories = ["multimedia::audio", "wasm", "science"]
exclude = [
    "demos/",
    "docs/",
    "scripts/",
    "test_data/",
    "tests/",
    "examples/",
    "benches/",
    "models/",
    "target/",
    ".github/",
    ".pmat/",
    ".pmat-work/",
    ".vscode/",
    ".idea/",
    "*.profraw",
    "*.profdata",
    "proptest-regressions/",
    "dhat-heap.json",
    "test_*",
    "*.log",
    "*.data",
    "contracts/",
    "book/",
]

default-run = "whisper-apr"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "whisper-apr"
path = "src/bin/whisper-apr-cli.rs"
required-features = ["cli"]

# Note: the `whisper-apr-cli` alias was removed in commit feat/cli-default-install
# (issue #55). The canonical binary name is `whisper-apr`, matching the crate name.
# Two bin targets pointing at the same source file caused a cargo warning and
# left users guessing which to invoke.

[[bin]]
name = "whisper-convert"
path = "tools/convert.rs"
required-features = ["converter"]

[features]
# Enable parallel by default for ~2x encoder speedup on multi-core systems
# WASM users should use "wasm" feature which doesn't include parallel
# `cli` is in default so `cargo install --path .` lands the `whisper-apr`
# binary on PATH without requiring users to remember a feature flag (#55).
# Library-only consumers should use `default-features = false` and pick
# the subset they want (e.g. `["std", "simd", "parallel"]`).
default = ["std", "simd", "realizar-inference", "parallel", "cli"]
std = []
wasm = ["std", "wasm-bindgen", "js-sys", "web-sys", "console_error_panic_hook"]
webgpu = ["wgpu", "bytemuck", "tokio", "pollster"]
# cuda = ["dep:trueno-gpu"]
simd = []
# Parallel execution via rayon (native multi-threading)
# Enables trueno/parallel for multi-threaded BLIS GEMM in encoder matmul
parallel = ["rayon"]
# WASM threaded mode: requires atomics + bulk-memory target features and COOP/COEP headers
wasm-threads = ["wasm-bindgen-rayon"]
tracing = ["dep:tracing"]
converter = ["reqwest", "serde", "serde_json", "tokio", "indicatif", "safetensors", "dirs", "zip"]
cli = ["clap", "serde", "serde_json", "tracing-subscriber", "hf-hub", "safetensors", "symphonia", "dirs", "parallel", "memmap2", "dep:apr-cli"]
cli-full = ["cli"]
# Multi-format audio decoding (MP3, FLAC, OGG, AAC, etc.)
symphonia = ["dep:symphonia"]
benchmark-tui = ["ratatui", "crossterm"]
tui = ["ratatui", "crossterm"]
# Use realizar's world-class inference primitives (attention, quantization, caching)
realizar-inference = ["dep:realizar"]
# Enable realizar's CUDA backend (50x speedup via trueno-gpu)
# WAPR-PERF-004: Include cuda feature to enable GPU-resident tensor architecture
# Note: realizar needs both 'gpu' and 'cuda' features for full CUDA support
# realizar-gpu = ["dep:realizar", "cuda"]
# Experimental probar APIs (zero-js validation, worker harness)
probar-experimental = []
# Gate integration tests that load large models (run with: cargo test --features integration-tests)
integration-tests = []
# APR format feature-gated modules (Phase 3 — Tier B)
format-signing = ["ed25519-dalek", "hex"]
format-encryption = ["aes-gcm", "argon2", "rand"]
format-quantize = ["aprender/format-quantize"]
format-homomorphic = ["aprender/format-homomorphic"]
# Heap profiling via dhat-rs (DHAT-compatible JSON output)
dhat-profiler = ["dep:dhat"]

[dependencies]
# Core dependencies
thiserror = "2"

# SIMD acceleration (trueno integration)
# Using crates.io versions for reproducible builds
trueno = { version = "0.19" }
# GPU-resident tensor architecture (WAPR-PERF-004)
trueno-gpu = { version = "0.4.36", optional = true }

# Model format (aprender is the canonical .apr format library)
# Note: safetensors-compare pulls hf-hub which doesn't support WASM
# Use target-specific deps below to enable it only for native builds
# Using local path for WASM-compatible trueno
aprender = { package = "aprender-core", version = "0.51", default-features = false, features = ["audio"] }

# APR CLI (proxied commands: pull, list)
apr-cli = { version = "0.51", optional = true }

# Inference primitives from realizar (shared attention, quantization, caching)
# This gives us: Flash Attention, Sliding Window, FusedLayerNorm, KVCache, PagedKV, Q4_K/Q6_K
realizar = { version = "0.9", optional = true, default-features = false }

# fp16 weight storage (2 bytes/weight vs 4 bytes/weight for f32)
half = "2"

# Optional: WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "console",
] }
console_error_panic_hook = { version = "0.1", optional = true }

# Optional: Tracing for renacer integration
tracing = { version = "0.1", optional = true }

# Optional: WebGPU compute backend
wgpu = { version = "23", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

# Optional: Parallel execution with Web Workers
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

# Optional: Converter dependencies
# Use rustls-tls (not default native-tls) so we don't pull openssl-sys → openssl-src,
# which requires perl + system build tooling in clean-room containers and fails to
# cross-compile to aarch64.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
indicatif = { version = "0.17", optional = true }
safetensors = { version = "0.4", optional = true }
dirs = { version = "5", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

# Optional: CLI dependencies
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
hf-hub = { version = "0.4", optional = true }

# Optional: Phase 3 crypto dependencies (feature-gated through format-*)
ed25519-dalek = { version = "2", optional = true }
hex = { version = "0.4", optional = true }
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }

# Optional: TUI benchmark dependencies
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }

# Optional: Heap profiling
dhat = { version = "0.3", optional = true }

# Memory-mapped file I/O for fast model loading (WAPR-KAIZEN Cycle 13)
memmap2 = { version = "0.9", optional = true }

# Optional: Multi-format audio decoding (MP3, FLAC, OGG, AAC, M4A, etc.)
# Pure Rust - no system dependencies required
symphonia = { version = "0.5", optional = true, default-features = false, features = [
    "mp3",      # MP3 decoding
    "flac",     # FLAC decoding
    "ogg",      # OGG container (Vorbis)
    "vorbis",   # Vorbis codec
    "aac",      # AAC decoding (M4A)
    "isomp4",   # MP4/M4A container
    "mkv",      # MKV/WebM container
    "wav",      # WAV container (fallback)
    "pcm",      # PCM codec
] }
provable-contracts-macros = "0.1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
# WASM testing with Probar (Playwright-compatible testing framework)
jugar-probar = { version = "1.0", default-features = false }
# Tempfile for CLI tests
tempfile = "3"
# serde_json needed for whisper_metadata test helpers (build_whisper_metadata, create_test_apr)
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Both getrandom versions need js/wasm_js feature for WASM
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Enable safetensors-compare only for native builds
# safetensors-compare: pulls hf-hub which doesn't support WASM
# Note: inference-monitoring disabled due to cyclic dependency with entrenar
aprender = { package = "aprender-core", version = "0.51", default-features = false }

# Dev/test debuginfo tuning (build-perf). Full `debug = 2` DWARF for this crate's
# huge dep graph produced a ~391 MiB test binary and slow cold links.
# `line-tables-only` keeps file:line in panic backtraces (the only debug info we
# actually use locally) while dropping variable/type DWARF; `unpacked`
# split-debuginfo keeps the per-object .o debug sections out of the final
# executable, shrinking it further and speeding linking.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
# opt-level = 1 keeps test compile time low while making hot test paths —
# notably the ~80 MB APR fixture serialize+CRC in format::validation and the
# Q4K decoder inference in benchmark_generated — run at a usable speed. At
# opt-level = 0 these run unoptimized and dominated the --lib wall clock.
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3  # Use full optimization for native (was "z" for size - killed SIMD!)

[profile.release-wasm]
inherits = "release"
opt-level = 3  # Full optimization for WASM (was "z" - kills SIMD!)

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Explicitly re-declared targets (autoexamples/autobenches = false above).
# Only feature-gated examples and benches that actually compile are kept so
# `cargo build --all-targets` is clean.

# The one example that genuinely needs a non-default feature (converter).
[[example]]
name = "filterbank_embedding"
required-features = ["converter"]

# Benches that compile cleanly against the current aprender API.
[[bench]]
name = "wasm_simd"
harness = false

[[bench]]
name = "streaming_latency"
harness = false

[[bench]]
name = "cli_benchmarks"
harness = false

# RETIRED benches (PMAT-158 / issue #54): the sources at benches/inference.rs,
# benches/pipeline.rs and benches/format_comparison.rs no longer compile against
# aprender 0.27 (MelFilterbank::new now takes &MelConfig, MelFilterbank::compute
# takes 1 arg, compute_simd was removed, format::AprReader was renamed). They are
# left on disk (un-built) until the API drift is repaired and they are
# re-declared here. Until then they no longer break `cargo build --all-targets`.


# NOTE (WAPR-PERF-004): GPU-Resident Tensor integration requires:
# 1. trueno-gpu 0.4.10+ (with GpuResidentTensor, batched_multihead_attention)
# 2. realizar 0.8+ (CudaExecutor with stable API, aarch64 cfg fix)

# Workspace-level lints for consistent code quality
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
# Correctness (critical)
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Performance
perf = { level = "warn", priority = -1 }

# Known Defects - strict error handling
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"

# Safety: every `unsafe` block must carry a `// SAFETY:` justification (PMAT-128)
undocumented_unsafe_blocks = "deny"

# Code quality
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Allow these pedantic lints (too noisy or inappropriate for numerical ASR code)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
similar_names = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
needless_raw_string_hashes = "allow"
cloned_instead_of_copied = "allow"
unused_async = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
used_underscore_binding = "allow"

# Local development: patch crates.io deps to use local versions with WASM fixes
# Commented out for crates.io publish — uncomment for local full-stack dev
# [patch.crates-io]
