name: Nightly Builds

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Is the nightly behind HEAD?
    runs-on: ubuntu-latest
    timeout-minutes: 21
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Is the published nightly behind HEAD?
        id: check
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — building regardless of commit age"
            exit 0
          fi
          # Build when the `nightly` tag is not HEAD. The old gate asked "any commit
          # in the last 24h?" -- a wall-clock window, not "was HEAD built?". A failed
          # nightly was never retried on a quiet day, and a scheduled run that was
          # dropped, queued or fired late left commits outside every window
          # (infra PMAT-1055). The release tags `nightly` at github.sha, so
          # tag == HEAD means built.
          NIGHTLY_SHA=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || echo none)
          if [ "$NIGHTLY_SHA" != "$SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "nightly $NIGHTLY_SHA is not HEAD $SHA"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "nightly is HEAD $SHA — skipping build"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        env:
          CROSS_NO_WARNINGS: "0"
        run: cross build --locked --release --target ${{ matrix.target }} --features cli

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }} --features cli

      - name: Package (unix)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../whisper-apr-${{ matrix.target }}.tar.gz whisper-apr
          cd ../../..

      - name: Package (windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../whisper-apr-${{ matrix.target }}.zip whisper-apr.exe
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-apr-${{ matrix.target }}
          path: whisper-apr-${{ matrix.target }}.*

  release:
    name: Release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          # Pin the tag to the commit this run BUILT. Unset, GitHub tags the default
          # branch tip at API-call time, and a commit landing mid-build would read as
          # built to the tag-vs-HEAD gate above and never be built.
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from `main`.

            **Commit:** ${{ needs.check.outputs.sha }}

            > This is a pre-release build and may be unstable.
          files: artifacts/*
