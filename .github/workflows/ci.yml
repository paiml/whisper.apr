# Sovereign CI — calls reusable workflow from paiml/.github
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@main
    with:
      repo: "whisper-apr"
      extra_pkgs: "make"
      # Lint shipped artifacts only (library + binaries). Test/example/bench
      # code contains idiomatic `expect()` — tests panic on failure BY
      # DESIGN, which is the test contract. `cargo test` enforces test
      # correctness; clippy-pedantic has no additional signal there.
      # `cargo clippy --lib --bins` is 0 errors; `--all-targets` is 893 —
      # entirely in non-shipped scaffolding.
      # Tracked: https://github.com/paiml/whisper.apr/issues/54 (PMAT-158)
      clippy_args: "--lib --bins"
      # One run of the suite per push, not two. `test` (cargo test --lib) and
      # `coverage` (cargo llvm-cov test --lib) run the SAME tests; measured on
      # run 42892540079: test job 1001 s (Run tests 799 s) + 2803 s queued,
      # coverage job 584 s. With this on, `test` is skipped and `ci / gate`
      # takes coverage=success as the test verdict; a coverage that failed,
      # was cancelled or skipped is RED (paiml/infra#3828).
      test_via_coverage: true
    secrets: inherit

  # whisper-convert (zip 9, #129): the reusable workflow never builds the
  # `converter` feature, so its clippy and tests run here. Required via `gate`.
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (converter)
        run: cargo clippy --locked --features converter --bin whisper-convert
      - name: test (converter)
        run: cargo test --locked --features converter --bin whisper-convert

  # Top-level gate: satisfies org ruleset which requires check named "gate".
  # The reusable workflow produces "ci / gate" but rulesets need exact match on "gate".
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    needs: [ci, converter]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "ci failed: ${{ needs.ci.result }}"
            exit 1
          fi
          if [ "${{ needs.converter.result }}" != "success" ]; then
            echo "converter failed: ${{ needs.converter.result }}"
            exit 1
          fi
          echo "All required jobs passed"

