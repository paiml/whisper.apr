# PMAT Quality Gates Configuration
# whisper.apr - WASM-First Speech Recognition

[compute-brick]
# Enable ComputeBrick compliance tracking
enabled = true
# GUI testing via probar
gui_testing = true

[file-health]
# Adjust thresholds for mature codebase with complex modules
max_lines_critical = 6000
max_lines_warning = 3000
# Exclude generated, test, and data files from quality gates
exclude = [
    "tests.rs",
    "benchmark.rs",
    "*_generated.rs",
]

[quality-gates]
# Exclude coverage test files from complexity/duplication analysis
exclude = [
    "**/*_generated.rs",
    "**/tests.rs",
    "**/test_*.rs",
]
