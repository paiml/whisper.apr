# PMAT Quality Gates Configuration
# whisper.apr - WASM-First Speech Recognition

[compute-brick]
# Enable ComputeBrick compliance tracking
enabled = true
# GUI testing via probar
gui_testing = true

[file-health]
# Adjust thresholds for mature codebase with complex modules
max_lines_critical = 6000
max_lines_warning = 3000
# Exclude generated, test, and data files from quality gates
exclude = [
    "tests.rs",
    "benchmark.rs",
    "*_generated.rs",
]

[quality-gates]
# Exclude generated files, tests, demos, examples, tools, and docs from quality gate analysis
exclude = [
    "**/*_generated.rs",
    "**/tests.rs",
    "**/test_*.rs",
    "demos/**",
    "examples/**",
    "tools/**",
    "book/**",
    "docs/**",
]

[entropy]
# Relax thresholds for mature codebase with inherently repetitive patterns
max_pattern_repetition = 12
min_pattern_diversity = 0.3
max_violations_to_report = 0
# Exclude generated files, demos, examples, tools, and inherently repetitive modules
exclude = [
    "**/*_generated.rs",
    "**/tests.rs",
    "**/test_*.rs",
    "demos/**",
    "examples/**",
    "tools/**",
    "book/**",
    "docs/**",
]

[tdg]
# Exclude generated files and non-code from TDG grading
exclude = [
    "**/*_generated.rs",
    "demos/**",
    "examples/**",
    "book/**",
    "docs/**",
]
# Allow B grade for GPU shader generators (inherently complex WGSL string assembly)
min_grade = "B"
